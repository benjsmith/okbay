# OKBay Atlas (option-3 Chromium --class=OkbayAtlas). Guest-ready Hyprland windowrules.
# Install: contrib/setup.sh copies this next to hypr config and sources it; then:
#   hyprctl reload
# Do not remove existing binds — this file is windowrules only.
#
# Solo Atlas (menu / open-atlas helper without OKBAY_ATLAS_TILED): float+fullscreen.
# Full-product Super+Shift+K sets OKBAY_ATLAS_TILED=1 and places Atlas in a 2x2
# grid on a fresh workspace (launcher unsets fullscreen/float after map).

windowrulev2 = float, class:^(OkbayAtlas)$
windowrulev2 = fullscreen, class:^(OkbayAtlas)$
# Optional: pin solo Atlas to a dedicated special workspace
# windowrulev2 = workspace special:okbay, class:^(OkbayAtlas)$
# Optional: quieter chrome
# windowrulev2 = noblur, class:^(OkbayAtlas)$
# windowrulev2 = noshadow, class:^(OkbayAtlas)$
