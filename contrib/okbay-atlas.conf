# OKBay Atlas (option-3 Chromium --class=OkbayAtlas). Guest-ready Hyprland windowrules.
# Install: contrib/setup.sh copies this next to hypr config and sources it; then:
#   hyprctl reload
# Do not remove existing binds — this file is windowrules only.
#
# Solo Atlas (menu / open-atlas helper without OKBAY_ATLAS_TILED): float is optional.
# Do NOT add fullscreen here — it fights Super+Shift+K full-product 2x2 (arrange
# places floating quadrants; a fullscreen windowrule re-covers the desktop and
# races place_final). Product launch sets OKBAY_ATLAS_TILED=1 and must not force
# fullscreen (Chromium --start-fullscreen nor windowrulev2 fullscreen).

# Optional: float solo Atlas (safe for product too — arrange keeps float set).
windowrulev2 = float, class:^(OkbayAtlas)$
# REMOVED (fights tiled/product 2x2): windowrulev2 = fullscreen, class:^(OkbayAtlas)$
# Optional: pin solo Atlas to a dedicated special workspace
# windowrulev2 = workspace special:okbay, class:^(OkbayAtlas)$
# Optional: quieter chrome
# windowrulev2 = noblur, class:^(OkbayAtlas)$
# windowrulev2 = noshadow, class:^(OkbayAtlas)$
